<svg xmlns="http://www.w3.org/2000/svg" width="540" height="410" viewBox="0 0 540 410">
  <style>
    .card { fill: #0b1220; stroke: #1d2d44; stroke-width: 1.5px; rx: 14px; }
    .dot-red { fill: #ff5f56; } .dot-yellow { fill: #ffbd2e; } .dot-green { fill: #27c93f; }
    .text-base { font-family: Consolas, 'Courier New', Courier, monospace; font-size: 13px; fill: #c5d1ec; white-space: pre; }
    .accent-hdr { fill: #39d353; font-weight: bold; }
    .accent-lbl { fill: #7dd0fc; font-weight: bold; }
    .separator { stroke: #577093; stroke-width: 1px; stroke-dasharray: 4 4; }
  </style>
  <rect width="100%" height="100%" fill="#01080f" />
  <rect x="8" y="8" width="524" height="394" class="card" />
  <!-- Window Title Bar Buttons -->
  <circle cx="28" cy="26" r="6" class="dot-red" />
  <circle cx="48" cy="26" r="6" class="dot-yellow" />
  <circle cx="68" cy="26" r="6" class="dot-green" />
  <g class="text-base">
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.15s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.15s" fill="freeze" />
      <text x="28" y="66"><tspan class="accent-hdr">anil@github</tspan> <tspan fill="#c5d1ec">~ $ neofetch --profile</tspan></text>
    </g>
    <line x1="28" y1="87" x2="512" y2="87" class="separator" opacity="0">
      <animate attributeName="opacity" from="0" to="0.6" dur="0.3s" begin="0.25s" fill="freeze" />
    </line>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.35s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.35s" fill="freeze" />
      <text x="28" y="128"><tspan class="accent-lbl">OS        : </tspan><tspan fill="#c5d1ec">Windows 10/11 / Linux (WSL)</tspan></text>
    </g>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.45s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.45s" fill="freeze" />
      <text x="28" y="159"><tspan class="accent-lbl">Host      : </tspan><tspan fill="#c5d1ec">KL University (AI &amp; Data Science)</tspan></text>
    </g>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.55s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.55s" fill="freeze" />
      <text x="28" y="190"><tspan class="accent-lbl">User      : </tspan><tspan fill="#c5d1ec">Anil Kumar (@AnilkumarMaripi)</tspan></text>
    </g>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.65s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.65s" fill="freeze" />
      <text x="28" y="221"><tspan class="accent-lbl">Role      : </tspan><tspan fill="#c5d1ec">AI &amp; Data Science Student</tspan></text>
    </g>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.75s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.75s" fill="freeze" />
      <text x="28" y="252"><tspan class="accent-lbl">Languages : </tspan><tspan fill="#c5d1ec">Python, Java, C, JavaScript</tspan></text>
    </g>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.85s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.85s" fill="freeze" />
      <text x="28" y="283"><tspan class="accent-lbl">Learning  : </tspan><tspan fill="#c5d1ec">Machine Learning, DSA, OS, Embedded Systems</tspan></text>
    </g>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.95s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="0.95s" fill="freeze" />
      <text x="28" y="314"><tspan class="accent-lbl">Tools     : </tspan><tspan fill="#c5d1ec">Git, GitHub, VS Code, Linux</tspan></text>
    </g>
    <g transform="translate(-16, 0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.05s" fill="freeze" />
      <animate attributeName="transform" from="translate(-16, 0)" to="translate(0, 0)" dur="0.35s" begin="1.05s" fill="freeze" />
      <text x="28" y="345"><tspan class="accent-lbl">Projects  : </tspan><tspan fill="#c5d1ec">DevGram, AI/ML Projects, Web Apps</tspan></text>
    </g>
  </g>
</svg>